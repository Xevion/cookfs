name: fetch-corpus
description: Sync the sample corpus from S3 (content-addressed zstd blobs plus a manifest) and export COOKFS_CORPUS_MANIFEST.

# Credentials arrive as job-level env, which the caller populates from repository secrets:
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, S3_ENDPOINT, S3_BUCKET. Linux only, which
# is where the corpus-backed lane runs; the other platforms exercise the skip path instead.

inputs:
  tier:
    description: Which manifest to sync, from corpus/<tier>.toml in the bucket.
    required: false
    default: ci

runs:
  using: composite
  steps:
    - name: Fetch manifest
      id: manifest
      shell: bash
      env:
        TIER: ${{ inputs.tier }}
      run: |
        set -euo pipefail
        dest="$RUNNER_TEMP/corpus"
        mkdir -p "$dest"
        aws s3 cp "s3://$S3_BUCKET/corpus/$TIER.toml" "$dest/manifest.toml" \
          --endpoint-url "$S3_ENDPOINT" --only-show-errors
        {
          echo "dest=$dest"
          echo "key=corpus-$TIER-$(sha256sum "$dest/manifest.toml" | cut -d' ' -f1)"
        } >> "$GITHUB_OUTPUT"

    # Samples run to gigabytes, so the blobs are cached and the manifest's own digest keys them:
    # a run pays the download only when the corpus itself changed.
    - name: Cache fixtures
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.manifest.outputs.dest }}/blobs
        key: ${{ steps.manifest.outputs.key }}

    - name: Sync fixtures
      shell: bash
      env:
        DEST: ${{ steps.manifest.outputs.dest }}
      # The exported GITHUB_ENV path is built from RUNNER_TEMP, never from an input.
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        blobs="$DEST/blobs"
        mkdir -p "$blobs"

        # The published manifest is machine-generated with a fixed shape (path then sha256 per
        # fixture), so a two-line awk extracts the pairs without a TOML parser.
        awk -F' = ' '
          /^path = /   { p=$2; gsub(/"/,"",p) }
          /^sha256 = / { s=$2; gsub(/"/,"",s); print p"\t"s }
        ' "$DEST/manifest.toml" > "$DEST/index.tsv"

        export DEST blobs

        sync_one() {
          local rel="$1" sha="$2" blob out got
          blob="$blobs/$sha"
          out="$DEST/$rel"
          if [ ! -f "$blob" ]; then
            aws s3 cp "s3://$S3_BUCKET/corpus/blobs/$sha.zst" "$blob.zst" \
              --endpoint-url "$S3_ENDPOINT" --only-show-errors
            zstd -qdf "$blob.zst" -o "$blob"
            rm -f "$blob.zst"
          fi
          got="$(sha256sum "$blob" | cut -d' ' -f1)"
          [ "$got" = "$sha" ] || { echo "sha256 mismatch for $rel: $got != $sha" >&2; exit 1; }
          mkdir -p "$(dirname "$out")"
          # Hardlink so a cache hit costs no second copy of a multi-gigabyte fixture.
          ln -f "$blob" "$out"
        }
        export -f sync_one

        # Fixtures are independent, so fan the downloads out instead of fetching them serially.
        # index.tsv has no embedded whitespace, so plain word-splitting into (rel, sha) pairs is safe.
        xargs -P4 -n2 bash -c 'sync_one "$0" "$1"' < "$DEST/index.tsv"

        echo "COOKFS_CORPUS_MANIFEST=$DEST/manifest.toml" >> "$GITHUB_ENV"
        echo "synced $(wc -l < "$DEST/index.tsv") corpus fixtures into $DEST"
