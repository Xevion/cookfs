name: setup
description: Install the mise-managed tools and restore the cargo cache. Rust itself comes from rust-toolchain.toml, which rustup reads on the first cargo invocation.

inputs:
  cache:
    description: Restore and save the cargo build cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install tools
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
    - name: Cache cargo
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
