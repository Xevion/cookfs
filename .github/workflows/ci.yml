name: ci

on:
  push:
    branches: [master] # PR branches run via pull_request; avoids the double run
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PR runs for a ref supersede each other. A master push gets a group of its own, so a pushed stack
# never loses a commit's verdict to the one behind it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: ./.github/actions/setup
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Lint docs
        run: cargo doc --workspace --all-features --no-deps
      - name: Check licences, bans and sources
        run: cargo deny check licenses bans sources
      - name: Check for unused dependencies
        run: cargo machete

  test:
    name: test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux-x64 }
          - { runner: macos-15, platform: macos-arm64 }
          - { runner: windows-2022, platform: windows-x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "1"
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: ./.github/actions/setup
      # `secrets` can't gate an `if`, but the job env it populates can: forks without the corpus
      # credentials, and the two non-Linux runners, run the suite's skip path instead.
      - name: Fetch sample corpus
        if: ${{ runner.os == 'Linux' && env.S3_ACCESS_KEY_ID != '' }}
        run: bun run tools/corpus.ts pull
      # Upstream Tcl cookfs, the oracle the sample tests diff against. Only where the corpus is.
      - name: Install Tcl
        if: ${{ runner.os == 'Linux' && env.S3_ACCESS_KEY_ID != '' }}
        run: sudo apt-get install -y --no-install-recommends tcl-dev
      - name: Cache the oracle build
        if: ${{ runner.os == 'Linux' && env.S3_ACCESS_KEY_ID != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/oracle/build
          key: oracle-${{ runner.os }}-${{ hashFiles('tools/oracle.ts') }}
      - name: Build the oracle and list the corpus through it
        if: ${{ runner.os == 'Linux' && env.S3_ACCESS_KEY_ID != '' }}
        timeout-minutes: 10
        run: |
          bun run tools/oracle.ts build
          bun run tools/oracle.ts dump
          echo "COOKFS_REQUIRE_CORPUS=1" >> "$GITHUB_ENV"
          echo "COOKFS_REQUIRE_ORACLE=1" >> "$GITHUB_ENV"
      - name: Run tests
        run: cargo nextest run --workspace --all-features
      - name: Run doctests
        run: cargo test --workspace --all-features --doc
