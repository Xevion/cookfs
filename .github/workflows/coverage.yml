name: coverage

on:
  push:
    branches: [master] # PR branches run via pull_request; avoids the double run
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# No `concurrency:` group on purpose: even with cancel-in-progress off, a group holds one pending
# run per ref and cancels the rest, so a pushed stack loses every commit's verdict but the last.

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      NEXTEST_PROFILE: ci # emits the junit report uploaded below
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: ./.github/actions/setup
      # Without the corpus the corpus-backed tests skip, which reports a real but smaller number
      # rather than a collapse. `secrets` can't gate an `if`, but the job env it populates can.
      - name: Fetch sample corpus
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        uses: ./.github/actions/fetch-corpus
      - name: Run tests with coverage
        run: just coverage
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage/html
          retention-days: 7
      # Codecov rejects tokenless uploads outright, so without the token these skip rather than
      # erroring into a green run. With it, a broken upload fails the job instead of going quiet.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: target/nextest/ci/junit.xml
          report_type: test_results
          fail_ci_if_error: true
