# Publishes to crates.io when release-please cuts a GitHub Release. release-please tags as
# `{crate}-v{version}`; which crate that names decides what gets built, but whether it actually
# ships is read from that crate's own `publish` field via `cargo metadata`.

name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Mint the OIDC token trusted publishing exchanges for a registry token.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Uncached: this build gets published, and any PR can write the cache it would restore.
      - name: Install toolchain
        uses: ./.github/actions/setup
        with:
          cache: false
      - name: Resolve crate from release tag
        id: crate
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          name="${TAG%-v[0-9]*}"
          publish=$(cargo metadata --no-deps --format-version 1 | jq -r --arg name "$name" '.packages[] | select(.name == $name) | .publish')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "publishable=$([ "$publish" = '[]' ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - name: Skip unpublishable crate
        if: steps.crate.outputs.publishable == 'false'
        env:
          CRATE_NAME: ${{ steps.crate.outputs.name }}
        run: echo "$CRATE_NAME has publish = false, nothing to publish" >> "$GITHUB_STEP_SUMMARY"
      # Trusted publishing: crates.io trades this job's OIDC identity for a token scoped to this
      # crate, revoked when the job ends.
      - name: Authenticate with crates.io
        if: steps.crate.outputs.publishable == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        if: steps.crate.outputs.publishable == 'true'
        env:
          CRATE_NAME: ${{ steps.crate.outputs.name }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p "$CRATE_NAME"
