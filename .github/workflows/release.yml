# Publishes cookfs to crates.io when release-please cuts its GitHub Release. metakit and bitrock
# are tracked by release-please for changelog/versioning but stay `publish = false` until they have
# something worth shipping; add a matching job (or condition) here keyed on their own tag prefix
# once that changes.

name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    if: startsWith(github.event.release.tag_name, 'cookfs-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Mint the OIDC token trusted publishing exchanges for a registry token.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Uncached: this build gets published, and any PR can write the cache it would restore.
      - name: Install toolchain
        uses: ./.github/actions/setup
        with:
          cache: false
      # Trusted publishing: crates.io trades this job's OIDC identity for a token scoped to this
      # crate, revoked when the job ends.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        run: cargo publish --locked -p cookfs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
