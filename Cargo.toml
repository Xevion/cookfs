[workspace]
resolver = "3"
members = ["crates/cookfs", "crates/metakit", "crates/bitrock"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Xevion/cookfs"

[workspace.lints.rust]
missing_docs = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
unescaped_backticks = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Offset and size arithmetic runs through the page and index layers throughout;
# narrowing casts there are the format's own encoding, not a latent bug.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"

doc_markdown = "allow"
missing_const_for_fn = "allow"

# Every suppression must say why; a bare allow hides intent and never warns
# when the lint stops firing.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
