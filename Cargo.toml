[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Xevion/cookfs"

[workspace.dependencies]
arbitrary-int = "2.2.0"
assert2 = "0.4.1"
bitbybit = "2.0.1"
brotli = "8.0.4"
crc32fast = "1.5.1"
bzip2 = "0.6.1"
flate2 = "1.1.9"
la-arena = "0.3.1"
liblzma = "0.4.8"
libtest-mimic = "0.8.2"
lru = "0.19.0"
parking_lot = "0.13.0"
positioned-io = "0.3.5"
proptest = "1.11.0"
rstest = "0.26.1"
snafu = "0.9.2"
toml = "1.1.4"
zip = "8.6.0"
zerocopy = { version = "0.8.63", features = ["derive"] }
zstd = "0.13.3"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
unused_lifetimes = "warn"
unused_qualifications = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
unescaped_backticks = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Tests may unwrap; `clippy.toml` allows it there.
unwrap_used = "warn"
expect_used = "warn"

# Offset and size arithmetic runs through the page and index layers throughout;
# narrowing casts there are the format's own encoding, not a latent bug.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"

# Contradicts `unreachable_pub`, which is the rule this workspace keeps.
redundant_pub_crate = "allow"

doc_markdown = "allow"
missing_const_for_fn = "allow"

# Every suppression must say why; a bare allow hides intent and never warns
# when the lint stops firing.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Own code at 1 keeps stack frames sane; the decoders the corpus tests lean on run at 2,
# since every page of a sample decompresses through one of them.
[profile.dev]
opt-level = 1

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.liblzma-sys]
opt-level = 2

[profile.dev.package.libbz2-rs-sys]
opt-level = 2

[profile.dev.package.brotli-decompressor]
opt-level = 2

[profile.dev.package.zstd-sys]
opt-level = 2

# Release with line tables for samply; never stripped.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
