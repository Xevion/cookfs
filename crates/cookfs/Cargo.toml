[package]
name = "cookfs"
description = "cookfs, the page-based Tcl virtual filesystem archive embedded in tclkit binaries and InstallBuilder installers"
keywords = ["cookfs", "tcl", "vfs", "archive", "installbuilder"]
categories = ["filesystem", "compression"]
readme = "README.md"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dev-dependencies]
assert2.workspace = true
proptest.workspace = true
rstest.workspace = true
toml.workspace = true
zip = "8.6.0"

[dependencies]
brotli = { version = "8.0.4", optional = true }
bzip2 = { version = "0.6.1", optional = true }
flate2 = "1.1.9"
la-arena = "0.3.1"
liblzma = "0.4.8"
lru = "0.18.2"
positioned-io = "0.3.5"
snafu = "0.9.2"
zstd = { version = "0.13.3", optional = true }

[features]
default = ["codec-bzip2", "codec-zstd", "codec-brotli"]
codec-bzip2 = ["dep:bzip2"]
codec-zstd = ["dep:zstd"]
codec-brotli = ["dep:brotli"]
