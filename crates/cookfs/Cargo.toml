[package]
name = "cookfs"
description = "cookfs, the page-based Tcl virtual filesystem archive embedded in tclkit binaries and InstallBuilder installers"
keywords = ["cookfs", "tcl", "vfs", "archive", "installbuilder"]
categories = ["filesystem", "compression"]
readme = "README.md"
# Fixtures and the corpus harness need the workspace around them, so they stay out of the package.
exclude = ["tests/", "proptest-regressions/"]
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
aes.workspace = true
arbitrary-int.workspace = true
bitbybit.workspace = true
brotli = { workspace = true, optional = true }
bzip2 = { workspace = true, optional = true }
cbc.workspace = true
crc32fast.workspace = true
flate2.workspace = true
la-arena.workspace = true
liblzma.workspace = true
lru.workspace = true
md-5.workspace = true
parking_lot.workspace = true
pbkdf2.workspace = true
positioned-io.workspace = true
sha2.workspace = true
snafu.workspace = true
zerocopy.workspace = true
zstd = { workspace = true, optional = true }

[dev-dependencies]
assert2.workspace = true
divan.workspace = true
libtest-mimic.workspace = true
proptest.workspace = true
rstest.workspace = true
toml.workspace = true
zip.workspace = true

[[bench]]
name = "read"
harness = false

# One case per corpus sample, so it runs under its own harness.
[[test]]
name = "samples"
harness = false

# `md-5` is imported by its library name, `md5`, which machete does not match to the package.
[package.metadata.cargo-machete]
ignored = ["md-5"]

[features]
default = ["codec-bzip2", "codec-zstd", "codec-brotli"]
codec-bzip2 = ["dep:bzip2"]
codec-zstd = ["dep:zstd"]
codec-brotli = ["dep:brotli"]
